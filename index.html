        <a href="#/groups" class="nav-item" data-route="groups">

        </a>
        <a href="#/library" class="nav-item" data-route="library">

        <a href="#/import" class="nav-item" data-route="import">

    <!-- Main Content -->
    <main id="main-content" class="main-content">

  <!-- Toast Notifications -->

    </div>

  <!-- Loading Overlay -->

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/advanced-diagnosis.js"></script>
  <script src="js/diagnosis.js"></script>
  <script src="js/plan-builder.js"></script>
  <script src="js/patient-monitor.js"></script>
  <script src="js/questionnaire-manager.js"></script>
  <script src="js/certificate-generator.js"></script>
  <script src="js/stubs.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/newcase.js"></script>
  <script src="js/patients.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  
  <!-- PWA Service Worker Registration -->
  <script>
    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('[SW] Service Worker зарегистрирован:', registration.scope);
            
            // Проверка обновлений
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Доступно обновление
                  if (confirm('Доступна новая версия приложения. Обновить?')) {
                    newWorker.postMessage({ action: 'skipWaiting' });
                  }
                }
              });
            });
          })
          .catch(error => {
            console.error('[SW] Ошибка регистрации Service Worker:', error);
          });
      });
    }
    
    // Индикатор офлайн режима
    function updateOnlineStatus() {
      if (navigator.onLine) {
        document.body.classList.remove('offline');
        console.log('[App] Онлайн режим');
      } else {
        document.body.classList.add('offline');
        console.log('[App] Офлайн режим');
        if (window.notifications) {
          window.notifications.warning('Нет подключения к интернету. Работа в офлайн режиме.', 'Офлайн');
        }
      }
    }
    
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
    
    // PWA Install Prompt
    let deferredPrompt;
    const installPrompt = document.createElement('div');
    installPrompt.className = 'pwa-install-prompt';
    installPrompt.innerHTML = `
      <h4>Установить RUKYA PRO</h4>
      <p>Установите приложение для быстрого доступа и работы офлайн</p>
      <div class="pwa-install-actions">
        <button class="pwa-install-primary" id="installBtn">Установить</button>
        <button class="pwa-install-secondary" id="dismissInstallBtn">Позже</button>
      </div>
    `;
    document.body.appendChild(installPrompt);
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Показываем prompt через 5 секунд после загрузки
      setTimeout(() => {
        installPrompt.classList.add('visible');
      }, 5000);
    });
    
    document.getElementById('installBtn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('[PWA] Выбор пользователя:', outcome);
        deferredPrompt = null;
        installPrompt.classList.remove('visible');
      }
    });
    
    document.getElementById('dismissInstallBtn')?.addEventListener('click', () => {
      installPrompt.classList.remove('visible');
      localStorage.setItem('pwa-install-dismissed', 'true');
    });
    
    // Скрываем prompt если уже отклонен
    if (localStorage.getItem('pwa-install-dismissed') === 'true') {
      installPrompt.classList.remove('visible');
    }
    
    // Обработка установки
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] Приложение установлено');
      installPrompt.classList.remove('visible');
      localStorage.removeItem('pwa-install-dismissed');
    });
  </script>
</body>
</html>
